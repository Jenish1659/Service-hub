name: service_hub_partner
description: ServiceHub - Partner Application for Shopkeepers, Service Providers, and Delivery Agents.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & State Management
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.3

  # Network & Cache
  dio: ^5.4.0
  supabase_flutter: ^2.3.4
  cached_network_image: ^3.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Maps & GPS (OpenStreetMap ₹0 Budget)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.3.1


  # Data Visualization (For Partner Dashboards)
  fl_chart: ^0.66.0

  # Utilities & Styling
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
